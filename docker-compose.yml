services:
  vclu:
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-unknown}
    image: vclu:latest
    container_name: vclu
    restart: unless-stopped
    network_mode: host          # required for UDP broadcast discovery
    volumes:
      - vclu-data:/data
    environment:
      - TZ=${TZ:-Europe/Warsaw}
    logging:                    # cap the container log at 3 x 10 MB
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  vclu-data:
