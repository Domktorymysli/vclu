version: 2

project_name: vclu

before:
  hooks:
    - go mod tidy
    - go vet ./...
    # Prepare flat layout for archive (install.sh expects these paths).
    # Hooks run without a shell: no globs or redirects outside sh -c.
    - rm -rf .release
    - mkdir -p .release/runtime
    - cp -r pkg/lua/runtime/. .release/runtime/
    - mkdir -p .release/docs/ai
    - sh -c 'cp docs/ai/*.md .release/docs/ai/ 2>/dev/null || true'
    # Unit for the .deb, from the install.sh template with its defaults
    - sh -c 'sed "s|@INSTALL_DIR@|/opt/vclu|g; s|@DATA_DIR@|/opt/vclu/data|g; s|@WEB_PORT@|8080|g" deploy/vclu.service > .release/vclu.service'

builds:
  # ARMv7 is a build of its own so the .deb takes one armhf binary (ARMv6, runs on both)
  - id: vclu
    main: ./cmd/vclu
    binary: vclu
    env:
      - CGO_ENABLED=0
    ldflags: &ldflags
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .ShortCommit }}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - "6"
    ignore:
      - goos: darwin
        goarch: arm
      - goos: darwin
        goarch: amd64
  - id: vclu-armv7
    main: ./cmd/vclu
    binary: vclu
    env:
      - CGO_ENABLED=0
    ldflags: *ldflags
    goos:
      - linux
    goarch:
      - arm
    goarm:
      - "7"

archives:
  - format: tar.gz
    name_template: "{{ .ProjectName }}-{{ .Os }}-{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}"
    files:
      - src: web/**/*
        strip_parent: false
      - src: .release/runtime
        dst: runtime
      - src: .release/docs/ai/*
        dst: docs/ai
        strip_parent: true
      - src: deploy/install.sh
        dst: .
        strip_parent: true
      - src: deploy/vclu.service
        dst: .
        strip_parent: true
      - src: LICENSE
        dst: .
        strip_parent: true

# Debian packages (amd64, arm64, armhf from the ARMv6 build: Raspberry Pi OS 32-bit runs on ARMv6).
# Same layout as install.sh; data stays outside the package (deploy/deb/).
nfpms:
  - id: deb
    ids: [vclu]
    package_name: vclu
    file_name_template: "{{ .ConventionalFileName }}"
    formats: [deb]
    vendor: Domktorymysli
    homepage: https://vclu.pl
    maintainer: Domktorymysli <https://github.com/Domktorymysli/vclu/issues>
    description: Virtual CLU - smart home controller for Grenton, Satel and more
    license: BUSL-1.1
    section: misc
    bindir: /opt/vclu
    recommends:
      - avahi-daemon
    contents:
      - src: web/
        dst: /opt/vclu/web
      - src: .release/runtime/
        dst: /opt/vclu/runtime
      - src: .release/docs/ai/
        dst: /opt/vclu/docs/ai
      - src: .release/vclu.service
        dst: /usr/lib/systemd/system/vclu.service
      - src: LICENSE
        dst: /usr/share/doc/vclu/copyright
    scripts:
      preinstall: deploy/deb/preinst
      postinstall: deploy/deb/postinst
      preremove: deploy/deb/prerm
      postremove: deploy/deb/postrm

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"

dockers:
  - id: amd64
    goarch: amd64
    use: buildx
    dockerfile: Dockerfile.release
    image_templates:
      - "ghcr.io/domktorymysli/vclu:{{ .Version }}-amd64"
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--provenance=false"
      - "--sbom=false"
    extra_files: &docker_files
      - web
      - pkg/lua/runtime
      - docs/ai
      - deploy/docker-entrypoint.sh
  - id: arm64
    goarch: arm64
    use: buildx
    dockerfile: Dockerfile.release
    image_templates:
      - "ghcr.io/domktorymysli/vclu:{{ .Version }}-arm64"
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--provenance=false"
      - "--sbom=false"
    extra_files: *docker_files

docker_manifests:
  - name_template: "ghcr.io/domktorymysli/vclu:{{ .Version }}"
    image_templates: &docker_images
      - "ghcr.io/domktorymysli/vclu:{{ .Version }}-amd64"
      - "ghcr.io/domktorymysli/vclu:{{ .Version }}-arm64"
  - name_template: "ghcr.io/domktorymysli/vclu:latest"
    image_templates: *docker_images
