version: 2

project_name: vclu

before:
  hooks:
    - go mod tidy
    - go vet ./...
    # Prepare flat layout for archive (install.sh expects these paths).
    # Hooks run without a shell: no globs or redirects outside sh -c.
    - rm -rf .release
    - mkdir -p .release/runtime
    - cp -r pkg/lua/runtime/. .release/runtime/
    - mkdir -p .release/docs/ai
    - sh -c 'cp docs/ai/*.md .release/docs/ai/ 2>/dev/null || true'

builds:
  - main: ./cmd/vclu
    binary: vclu
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .ShortCommit }}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - "6"
      - "7"
    ignore:
      - goos: darwin
        goarch: arm
      - goos: darwin
        goarch: amd64

archives:
  - format: tar.gz
    name_template: "{{ .ProjectName }}-{{ .Os }}-{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}"
    files:
      - src: web/**/*
        strip_parent: false
      - src: .release/runtime
        dst: runtime
      - src: .release/docs/ai/*
        dst: docs/ai
        strip_parent: true
      - src: deploy/install.sh
        dst: .
        strip_parent: true
      - src: deploy/vclu.service
        dst: .
        strip_parent: true
      - src: LICENSE
        dst: .
        strip_parent: true

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"

dockers:
  - id: amd64
    goarch: amd64
    use: buildx
    dockerfile: Dockerfile.release
    image_templates:
      - "ghcr.io/domktorymysli/vclu:{{ .Version }}-amd64"
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--provenance=false"
      - "--sbom=false"
    extra_files: &docker_files
      - web
      - pkg/lua/runtime
      - docs/ai
  - id: arm64
    goarch: arm64
    use: buildx
    dockerfile: Dockerfile.release
    image_templates:
      - "ghcr.io/domktorymysli/vclu:{{ .Version }}-arm64"
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--provenance=false"
      - "--sbom=false"
    extra_files: *docker_files

docker_manifests:
  - name_template: "ghcr.io/domktorymysli/vclu:{{ .Version }}"
    image_templates: &docker_images
      - "ghcr.io/domktorymysli/vclu:{{ .Version }}-amd64"
      - "ghcr.io/domktorymysli/vclu:{{ .Version }}-arm64"
  - name_template: "ghcr.io/domktorymysli/vclu:latest"
    image_templates: *docker_images
