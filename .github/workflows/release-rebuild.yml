name: Release rebuild

# Rebuilds the archives and images of an existing release from its tag.
# Delete the release's assets first: GoReleaser does not overwrite them. Keep the security record
# and its scans (vclu-*-security.json, vclu-*-scan-*.tar.gz): this does not scan again, but
# makes the images' SBOMs again and updates the record's SBOM checksums.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to rebuild, e.g. v1.3.0"
        required: true

permissions:
  contents: write
  packages: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: anchore/sbom-action/download-syft@v0

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The images were pushed again: their SBOMs and the record follow. A tag from before
      # the security records has neither.
      - name: SBOM and security record
        if: hashFiles('.github/security-record.sh') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          v=${TAG#v}
          for arch in amd64 arm64; do
            .github/imagescan.sh "ghcr.io/domktorymysli/vclu:$v-$arch" --format spdx-json -o "vclu-$v-image-$arch.spdx.json"
          done
          gh release upload "$TAG" vclu-$v-image-*.spdx.json --clobber
          record=vclu-$v-security.json
          if gh release download "$TAG" -p "$record"; then
            .github/security-record.sh sboms "$record" dist/*.spdx.json vclu-$v-image-*.spdx.json
            gh release upload "$TAG" "$record" --clobber
          fi
