name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  # What the release ships, scanned before anything is published (.github/scan-release.sh)
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      # Raw output and results kept for the release's security record (.github/security-record.sh)
      - name: Binaries and image
        run: .github/scan-release.sh
        env:
          SCAN_OUT: ${{ runner.temp }}/scan

      - name: Vendored web libraries
        run: .github/vendorcheck.sh
        env:
          SCAN_OUT: ${{ runner.temp }}/scan

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scan
          path: ${{ runner.temp }}/scan

  release:
    needs: scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      # arm64 image runs apk under emulation
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GoReleaser's SBOMs of the archives and .deb packages (.github/sbom.sh)
      - uses: anchore/sbom-action/download-syft@v0

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # SBOMs of the published images (system packages and the binary's Go modules), as release assets
      - name: SBOM
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=${GITHUB_REF_NAME#v}
          for arch in amd64 arm64; do
            .github/imagescan.sh "ghcr.io/domktorymysli/vclu:$v-$arch" --format spdx-json -o "vclu-$v-image-$arch.spdx.json"
          done
          gh release upload "$GITHUB_REF_NAME" vclu-$v-image-*.spdx.json

      - uses: actions/download-artifact@v4
        with:
          name: scan
          path: ${{ runner.temp }}/scan

      # What was built, with what, and the scan before it (SECURITY.md, "Security records")
      - name: Security record
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=${GITHUB_REF_NAME#v}
          record=vclu-$v-security.json
          .github/security-record.sh scan "$record" "$RUNNER_TEMP/scan" release "$GITHUB_REF_NAME" "$GITHUB_SHA" "$(go env GOVERSION)"
          .github/security-record.sh sboms "$record" dist/*.spdx.json vclu-$v-image-*.spdx.json
          gh release upload "$GITHUB_REF_NAME" "$record" vclu-$v-scan-*.tar.gz
