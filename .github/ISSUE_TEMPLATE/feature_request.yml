name: Feature request
description: An idea for vCLU
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What do you want to do in your house?
      description: The problem, not the solution. What devices, what should happen.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How do you do it today?
      description: Existing Lua API, a plugin, a workaround, or not possible at all.
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Optional. Many things fit better as a Lua module or a plugin than as a new core API.
